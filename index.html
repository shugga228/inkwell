<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Editor</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <label class="file-input">
          Open PDF
          <input id="pdfInput" type="file" accept="application/pdf" />
        </label>

        <div class="tool-group">
          <label>
            Tool
            <select id="toolSelect">
              <option value="pen">Pen</option>
              <option value="highlighter">Highlighter</option>
            </select>
          </label>
          <label>
            Pen color
            <input id="penColor" type="color" value="#0f172a" />
          </label>
          <label>
            Highlighter color
            <input id="highlighterColor" type="color" value="#fde047" />
          </label>
        </div>

        <div class="tool-group">
          <label class="inline-option">
            <input id="smoothingEnabled" type="checkbox" checked />
            Smoothing
          </label>
          <label>
            Weight
            <input id="smoothingWeight" type="range" min="0" max="0.95" step="0.05" value="0.65" />
          </label>
          <output id="weightValue">0.65</output>
        </div>

        <button id="exportButton" type="button" disabled>Export PDF</button>
      </header>

      <main>
        <p id="status">Load a PDF to start annotating.</p>
        <div id="pages" class="pages"></div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
